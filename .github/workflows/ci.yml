name: .NET 8 CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore RyzomModern.sln

    - name: Build Solution
      run: dotnet build RyzomModern.sln --no-restore --configuration Release

    - name: Run Unit Tests
      run: dotnet test RyzomModern.sln --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test_results.trx"
